<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%" style="background-color: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="title-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="grid-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg-gradient)"/>
  
  <!-- Dynamic Background Grid / Wave Visuals (Background element - behind text) -->
  <g stroke="#30363d" stroke-width="1" opacity="0.4">
    <!-- Grid Lines -->
    <line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    
    <line x1="200" y1="0" x2="200" y2="300"/>
    <line x1="400" y1="0" x2="400" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="800" y1="0" x2="800" y2="300"/>
    <line x1="1000" y1="0" x2="1000" y2="300"/>
  </g>

  <!-- Animated Pulse Node Graph (Dynamic aspect placed low/background) -->
  <g fill="none" opacity="0.6">
    <path d="M 50,220 Q 250,160 450,240 T 850,200 T 1150,250" stroke="#1f6feb" stroke-width="2" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M 50,250 Q 300,200 600,270 T 1150,210" stroke="#238636" stroke-width="2" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" from="0" to="100" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Dynamic Pulsing Nodes -->
  <circle cx="250" cy="180" r="4" fill="#58a6ff">
    <animate attributeName="r" values="4;8;4" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="270" r="5" fill="#3fb950">
    <animate attributeName="r" values="5;9;5" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="850" cy="200" r="4" fill="#bc8cff">
    <animate attributeName="r" values="4;7;4" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Decorative Accent Pill Tags (Positioned away from main center text) -->
  <g stroke="#30363d" stroke-width="1">
    <rect x="60" y="35" width="140" height="28" rx="14" fill="#161b22" opacity="0.8"/>
    <text x="130" y="53" fill="#8b949e" font-size="12" font-weight="600" text-anchor="middle">📡 GPS TRACKING</text>
    
    <rect x="1000" y="35" width="140" height="28" rx="14" fill="#161b22" opacity="0.8"/>
    <text x="1070" y="53" fill="#8b949e" font-size="12" font-weight="600" text-anchor="middle">⚡ AUTO-DISPATCH</text>
  </g>

  <!-- Foreground Title and Subtitle (Ensured crystal clear visibility) -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="125" fill="url(#title-gradient)" font-size="44" font-weight="800" letter-spacing="1.5" filter="url(#glow)">
      Awesome Field Workforce Management
    </text>
    <text x="600" y="125" fill="url(#title-gradient)" font-size="44" font-weight="800" letter-spacing="1.5">
      Awesome Field Workforce Management
    </text>

    <!-- Subtitle -->
    <text x="600" y="165" fill="#c9d1d9" font-size="18" font-weight="500" letter-spacing="0.5">
      A Curated Ecosystem of SaaS Platforms, Open-Source Tools &amp; FSM Frameworks
    </text>

    <!-- Badges Row / Decorative Text inside Banner -->
    <text x="600" y="200" fill="#8b949e" font-size="13" font-weight="600" letter-spacing="1">
      SCHEDULING • DISPATCH • MOBILE EXECUTION • TECHNICIAN TRACKING • WORK ORDERS
    </text>
  </g>
</svg>
